<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rise Canvas Sync</title>
    <link rel="icon" href="../images/icon-32.png">
    <link rel="stylesheet" href="../styles/fonts.css">
    <link rel="stylesheet" href="welcome.css">
  </head>
  <body>
    <main class="card">
      <div class="logo-tile">
        <img src="../images/rise-logo.png" alt="" width="68" height="68">
      </div>

      <h1>Rise Canvas Sync is <span class="ready">ready</span></h1>

      <p class="intro">
        Open Canvas in a new tab and Rise will automatically detect and sync your courses and assignments.
      </p>

      <p class="hint">🌤 Can't find Canvas yet — open it up and we'll auto-sync ✨</p>

      <a class="canvas-button" id="open-canvas" href="#">
        <img src="../images/canvas-logo.svg" alt="" width="20" height="20">
        Canvas
      </a>
    </main>

    <div class="scenery" aria-hidden="true">
      <img class="hills" src="../images/welcome-hills.svg" alt="">
      <img class="sun" src="../images/welcome-sun.svg" alt="">
    </div>

    <script src="../config.js"></script>
    <script src="welcome.js"></script>
  </body>
</html>
